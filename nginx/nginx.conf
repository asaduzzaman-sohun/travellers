worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Client IP rate-limit zones (shared memory)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=15r/m;
    limit_req_zone $binary_remote_addr zone=booking_limit:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:20m rate=150r/m;
    limit_req_status 429;

    upstream tourflow_backend_pool {
        least_conn;
        server backend-1:5000 max_fails=3 fail_timeout=15s;
        server backend-2:5000 max_fails=3 fail_timeout=15s;
        keepalive 32;
    }

    upstream tourflow_hub_pool {
        ip_hash;
        server backend-1:5000 max_fails=3 fail_timeout=15s;
        server backend-2:5000 max_fails=3 fail_timeout=15s;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name _;

        # Gateway Health Check
        location = /lb-health {
            return 200 '{"status":"Healthy","gateway":"Nginx-LeastConn","upstreams":["backend-1:5000","backend-2:5000"]}';
            add_header Content-Type application/json;
        }

        # Strict Sliding/Leaky Bucket Protection for Authentication Routes
        location /api/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://tourflow_backend_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            add_header X-LoadBalancer "TourFlow-Nginx" always;
        }

        # Burst-tolerant Bucket for Bookings & Payments
        location ~ ^/api/(bookings|payments) {
            limit_req zone=booking_limit burst=12 nodelay;
            proxy_pass http://tourflow_backend_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            add_header X-LoadBalancer "TourFlow-Nginx" always;
        }

        # SignalR WebSockets / SSE / LongPolling Hubs (sticky upstream + upgrade headers)
        location /hubs/ {
            proxy_pass http://tourflow_hub_pool;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            add_header X-LoadBalancer "TourFlow-Nginx-Hub" always;
        }

        # General API & Static Media Routing
        location / {
            limit_req zone=api_limit burst=40 nodelay;
            proxy_pass http://tourflow_backend_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            add_header X-LoadBalancer "TourFlow-Nginx" always;
        }
    }
}
